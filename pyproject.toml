[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exobem"
version = "0.1.0"
description = "ExoBEM: building energy simulation for lunar and Martian habitats (EnergyPlus heat-balance method with planetary extensions)"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "python-docx"]

[project.scripts]
exobem = "exobem.io:main"

[tool.setuptools.packages.find]
include = ["exobem*"]
